<!doctype html><html><head><meta charset="utf-8"><title>FinSight - Dashboard</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"></head><body>
<div class="nav"><div><b>FinSight</b><small>Investigation workspace</small></div><div><span id="who"></span> &nbsp;<button onclick="logout()">Sign out</button></div></div>
<div class="wrap">
 <div class="filters">
  <div class="fg"><label>Start investigation from</label><div class="row"><select id="etype"><option value="employee">Employee</option><option value="account">Account</option></select><select id="eid"></select><button class="p" onclick="startManual()">Investigate</button></div></div><div class="sep"></div>
  <div class="fg"><label>Seeds: min score</label><select id="fscore" onchange="drawSeeds()"><option value="0">Any</option><option value="0.6">&ge; 0.6</option><option value="0.9">&ge; 0.9</option></select></div>
  <div class="fg"><label>Seeds: status</label><select id="fstat" onchange="drawSeeds()"><option>ALL</option><option>PENDING</option><option>ACCEPTED</option><option>DISMISSED</option></select></div><div class="sep"></div>
  <div class="fg"><label>Activity risk</label><select id="frisk" onchange="ACT=0;render()"><option>ALL</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option><option>CLEAR</option></select></div>
  <div class="fg"><label>Rule category</label><select id="fcat" onchange="ACT=0;render()"><option>ALL</option></select></div>
  <button onclick="resetF()">Reset filters</button>
 </div>
 <h3 style="margin:14px 0 0">Investigation seeds <span class="tag">screening leads</span></h3><div class="seeds" id="seeds"></div>
 <div id="inv"><div class="card mu">Accept a seed or choose an employee/account above to open an investigation.</div></div>
</div><script src="config.js"></script><script src="app.js"></script></body></html>
